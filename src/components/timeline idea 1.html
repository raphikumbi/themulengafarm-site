<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malleus Timeline – GSAP Line Draw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    .line-progress { stroke-dasharray: 1000; stroke-dashoffset: 1000; }
  </style>
</head>
<body class="bg-[#0f1a14] text-emerald-50 antialiased">
  <div id="app" class="min-h-screen py-16 px-4">
    <div class="max-w-3xl mx-auto">
      <div class="text-center mb-16">
        <p class="text-emerald-400/80 text-xs tracking-[0.25em] uppercase">The Malleus Project</p>
        <h1 class="text-3xl md:text-4xl font-bold mt-3">Achievements & Goals</h1>
      </div>

      <div class="relative">
        
        <!-- SVG line -->
        <svg class="absolute left-6 md:left-1/2 top-0 bottom-0 w-1 h-full -translate-x-1/2 overflow-visible pointer-events-none" style="height:100%">
          <line id="progress-line" x1="0" y1="0" x2="0" y2="100%" stroke="#34d399" stroke-width="3" class="line-progress" />
        </svg>

        <div class="space-y-14">
          <div v-for="(item, i) in items" :key="i" class="timeline-card relative flex flex-col md:flex-row md:items-center gap-4 opacity-0">
            <div class="absolute left-6 md:left-1/2 w-4 h-4 rounded-full bg-emerald-400 border-4 border-[#0f1a14] -translate-x-1/2 z-10"></div>

            <div :class="['ml-14 md:ml-0 md:w-5/12', i % 2 === 0 ? 'md:pr-10 md:text-right md:mr-auto' : 'md:pl-10 md:ml-auto']">
              <span class="text-emerald-400 font-mono text-sm">{{ item.year }}</span>
              <h3 class="text-xl font-semibold mt-1">{{ item.title }}</h3>
              <p class="text-emerald-100/70 text-sm mt-2 leading-relaxed">{{ item.desc }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp, onMounted } = Vue;
    createApp({
      setup() {
        const items = [
          { year: '2018', title: '1st Meeting of Lament', desc: 'Holon Garden. The first gathering that started everything.' },
          { year: '2021', title: 'Studies & Framework', desc: 'Advocacy, curriculum, mentorship and ecological research foundations.' },
          { year: '2022', title: 'Online Mentorship', desc: 'Ready and launched from Singapore, connecting people globally.' },
          { year: '2024', title: '1st Building', desc: 'Land and officers secured. Roots in the ground.' },
          { year: '2025', title: 'Open School & Funding', desc: '3 000 USD crowdfunding. Classes open. Learning Center & eco systems start.' },
          { year: '2027', title: 'Campus 10 ha', desc: 'Phase 1 of campus development begins.' },
          { year: 'Future', title: 'Environmental Action', desc: 'The ongoing challenge and growth of The Malleus Project.' }
        ];

        onMounted(() => {
          gsap.registerPlugin(ScrollTrigger);

          // Line draw
          const line = document.getElementById('progress-line');
          gsap.to(line, {
            strokeDashoffset: 0,
            ease: 'none',
            scrollTrigger: {
              trigger: '#app',
              start: 'top top',
              end: 'bottom bottom',
              scrub: 1
            }
          });

          // Cards
          gsap.utils.toArray('.timeline-card').forEach((card) => {
            gsap.to(card, {
              opacity: 1,
              duration: 0.6,
              ease: 'power2.out',
              scrollTrigger: {
                trigger: card,
                start: 'top 80%',
                toggleActions: 'play none none reverse'
              }
            });
          });
        });

        return { items };
      }
    }).mount('#app');
  </script>
</body>
</html>
